name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install tooling
        run: |
          python -m pip install ruff==0.16.5
          curl -fsSL -o shfmt https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          sudo install shfmt /usr/local/bin/

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Shell
        run: |
          shellcheck skills/orchestrator/scripts/delegate
          shfmt -d -i 4 -ci -bn skills/orchestrator/scripts/delegate

      - name: Prettier
        run: npx --yes prettier@3.9.6 --check .

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Logo scripts
        working-directory: skills/logo-design/scripts
        run: |
          python search_library.py --type wordmark --limit 3
          python svg_audit.py ../assets/library/svg/airbnb.svg

      - name: Delegate
        run: sh skills/orchestrator/scripts/delegate list
