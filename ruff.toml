
extend-exclude = ["private"]

line-length = 120
target-version = "py311"

[format]
indent-style = "tab"
quote-style = "preserve"
skip-magic-trailing-comma = false

[lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "SIM", "UP", "ARG", "PLE", "PLW", "FURB", "RUF"]

[lint.per-file-ignores]
# Typographic dashes and signs in prose are intended.
"skills/**" = ["RUF001", "RUF002", "RUF003"]
